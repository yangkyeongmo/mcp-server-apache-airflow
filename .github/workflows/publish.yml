name: Publish Python Package

# Production:  git tag vX.Y.Z      -> PyPI (OIDC trusted publishing)
# Pre-release: git tag vX.Y.ZrcN   -> TestPyPI (OIDC trusted publishing)
#
# Do not set PYPI_API_TOKEN or any other package-index secret. Register the
# trusted publisher on PyPI / TestPyPI instead (see RELEASING.md).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish-pypi:
    name: publish-pypi
    if: github.ref_type == 'tag' && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-server-apache-airflow
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must be vX.Y.Z (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag version ${TAG} does not match pyproject.toml version ${PKG}"
            exit 1
          fi

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: smoke-pypi
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke install from PyPI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            if python -m pip install --no-cache-dir "mcp-server-apache-airflow==${VERSION}"; then
              break
            fi
            echo "PyPI install attempt ${attempt} failed; waiting for index..."
            sleep 20
            if [[ "$attempt" -eq 8 ]]; then
              echo "Failed to install mcp-server-apache-airflow==${VERSION} from PyPI"
              exit 1
            fi
          done
          mcp-server-apache-airflow --help

  publish-testpypi:
    name: publish-testpypi
    if: github.ref_type == 'tag' && contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-server-apache-airflow
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "TestPyPI tags must be vX.Y.ZrcN (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag version ${TAG} does not match pyproject.toml version ${PKG}"
            exit 1
          fi

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: smoke-testpypi
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke install from TestPyPI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            if python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "mcp-server-apache-airflow==${VERSION}"; then
              break
            fi
            echo "TestPyPI install attempt ${attempt} failed; waiting for index..."
            sleep 20
            if [[ "$attempt" -eq 8 ]]; then
              echo "Failed to install mcp-server-apache-airflow==${VERSION} from TestPyPI"
              exit 1
            fi
          done
          mcp-server-apache-airflow --help
