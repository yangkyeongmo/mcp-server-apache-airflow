name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  classify:
    name: classify-tag
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.parse.outputs.target }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and verify pyproject version
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag '$TAG'. Use vX.Y.Z for PyPI or vX.Y.ZrcN for TestPyPI."
            exit 1
          fi
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "pyproject.toml version '$PKG_VERSION' does not match tag version '$VERSION'."
            exit 1
          fi

  publish:
    name: publish
    needs: classify
    runs-on: ubuntu-latest
    environment: ${{ needs.classify.outputs.target }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        if: needs.classify.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI (OIDC trusted publishing)
        if: needs.classify.outputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke:
    name: smoke-install
    needs: [classify, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke install published package
        env:
          TARGET: ${{ needs.classify.outputs.target }}
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          install_pkg() {
            if [[ "$TARGET" == "testpypi" ]]; then
              python -m pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple \
                "mcp-server-apache-airflow==${VERSION}"
            else
              python -m pip install "mcp-server-apache-airflow==${VERSION}"
            fi
          }
          for attempt in 1 2 3 4 5 6; do
            if install_pkg; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Failed to install mcp-server-apache-airflow==${VERSION} from ${TARGET}"
              exit 1
            fi
            echo "Install attempt ${attempt} failed; waiting for index..."
            sleep 20
          done
          mcp-server-apache-airflow --help
