[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: live Airflow REST calls (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    contract: OpenAPI contract tests against the vendored Airflow stable REST spec 
