[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    integration: live tests against a running Airflow instance (deselect with '-m "not integration"')
    contract: OpenAPI contract tests against the vendored Airflow REST spec
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
